<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamster Tube</title>
    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header Section -->
        <header>
            <h1>🐹 Hamster Video Stream</h1>
            <p id="username">Welcome, Hamster Viewer! 🐹</p>
        </header>

        <!-- Video List Section -->
        <section id="video-list-section">
            <div id="video-grid" class="video-grid">
                <!-- JavaScript দিয়ে ভিডিও কার্ডগুলো এখানে রেন্ডার হবে -->
            </div>
        </section>

        <!-- Player Section -->
        <section id="player-section" class="hidden">
            <h2 id="now-playing">Video Title</h2>
            
            <!-- যেকোনো .com ওয়েবসাইট বা ভিডিও এমবেড করার জন্য প্লেয়ার র‍্যাপার -->
            <div id="player-wrapper">
                <video id="video-player" controls style="width:100%; display:none;">
                    <source id="video-source" src="" type="video/mp4">
                </video>
            </div>

            <button id="back-btn">⬅ Back to List</button>
        </section>

        <!-- Ad Popup Modal -->
        <div id="ad-modal" class="modal hidden">
            <div class="modal-content">
                <h3>📺 Sponsored Ad</h3>
                <p>Please watch this ad for <span id="countdown">5</span> seconds...</p>
                <button id="skip-ad-btn" disabled>Please wait (5s)</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
